<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Rubik's Tracker (พอดี 10 ตัว)</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
            background: linear-gradient(-45deg, #1a2a6c, #b21f1f, #fdbb2d);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow: hidden;
            color: #333;
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .header {
            margin-top: 10px;
            margin-bottom: 10px;
            color: white;
            text-align: center;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
        }

        .header h1 {
            margin: 0;
            font-size: 24px;
            letter-spacing: 1px;
        }

        /* --- แผงปุ่มกด --- */
        .keypad {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px; /* ลดช่องไฟปุ่มเพื่อให้มีที่ว่างในจอมากขึ้น */
            width: 95%; /* ขยายความกว้างแผงปุ่ม */
            max-width: 450px;
            background: rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(10px);
            padding: 12px;
            border-radius: 15px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2);
            margin-bottom: 12px;
            box-sizing: border-box;
        }

        button.cube-btn {
            position: relative;
            padding: 10px 0;
            font-size: 18px;
            font-weight: 900;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            outline: none;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.3);
            transition: transform 0.1s;
            -webkit-tap-highlight-color: transparent;
        }

        button.cube-btn:active {
            transform: translateY(4px);
        }

        .btn-u { background-color: #ffffff; color: #333 !important; text-shadow: none !important; box-shadow: 0 4px 0 #cccccc; }
        .btn-u:active { box-shadow: 0 0px 0 #cccccc; }
        .btn-d { background-color: #ffd500; color: #333 !important; text-shadow: none !important; box-shadow: 0 4px 0 #ccaa00; }
        .btn-d:active { box-shadow: 0 0px 0 #ccaa00; }
        .btn-l { background-color: #ff5800; color: white; box-shadow: 0 4px 0 #cc4600; }
        .btn-l:active { box-shadow: 0 0px 0 #cc4600; }
        .btn-r { background-color: #b71234; color: white; box-shadow: 0 4px 0 #8c0e27; }
        .btn-r:active { box-shadow: 0 0px 0 #8c0e27; }
        .btn-f { background-color: #009b48; color: white; box-shadow: 0 4px 0 #007a38; }
        .btn-f:active { box-shadow: 0 0px 0 #007a38; }
        .btn-b { background-color: #0046ad; color: white; box-shadow: 0 4px 0 #003685; }
        .btn-b:active { box-shadow: 0 0px 0 #003685; }

        .prime {
            background-image: linear-gradient(45deg, rgba(255,255,255,0.15) 25%, transparent 25%, transparent 50%, rgba(255,255,255,0.15) 50%, rgba(255,255,255,0.15) 75%, transparent 75%, transparent);
            background-size: 10px 10px;
        }

        /* --- แผงแสดงผล --- */
        .display-board {
            width: 96%; /* ขยายพื้นที่กล่องให้ชิดขอบจอมากขึ้น */
            max-width: 450px;
            background: #fff;
            border-radius: 15px;
            padding: 10px 8px; /* ลดขอบในซ้ายขวา */
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2);
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            overflow-y: auto;
            margin-bottom: 15px;
            box-sizing: border-box;
        }

        .step-row {
            display: flex;
            align-items: center;
            width: 100%;
            margin-bottom: 8px;
            cursor: pointer;
            transition: transform 0.2s ease;
        }

        .step-row.active-container {
            transform: scale(1.01); /* ลดแอนิเมชันขยายร่างลงนิดนึงเพื่อไม่ให้ข้อความล้นจอ */
        }

        .step-label {
            width: 45px; /* บีบป้ายชื่อให้แคบลง */
            font-weight: 800;
            font-size: 12px;
            color: #555;
            text-align: right;
            padding-right: 6px;
        }

        .step-input {
            flex-grow: 1;
            padding: 8px 5px; /* ลดขอบในให้มีที่วางอักษรเยอะขึ้น */
            font-size: 13.5px; /* ขนาดกำลังดีสำหรับ 10 ตัวบนมือถือ */
            letter-spacing: -0.3px; /* บีบช่องไฟระหว่างตัวอักษรลง */
            font-family: 'Courier New', Courier, monospace;
            border: 2px solid #ddd;
            border-radius: 6px;
            background-color: #fafafa;
            pointer-events: none;
            color: #111;
            transition: all 0.3s;
            width: 0; 
        }

        .active-step {
            border-color: #ff5800 !important;
            background-color: #fff0e6 !important;
            box-shadow: 0 0 8px rgba(255, 88, 0, 0.3);
        }

        /* --- ปุ่มเครื่องหมายถูก --- */
        .next-btn {
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 6px;
            padding: 6px 10px; /* ลดขนาดปุ่ม */
            margin-left: 5px;
            font-size: 14px;
            cursor: pointer;
            box-shadow: 0 3px 0 #2E7D32;
            transition: all 0.2s;
            -webkit-tap-highlight-color: transparent;
        }

        .next-btn:active {
            transform: translateY(3px);
            box-shadow: 0 0 0 #2E7D32;
        }

        .step-row:not(.active-container) .next-btn {
            background-color: #ccc;
            box-shadow: 0 3px 0 #aaa;
            opacity: 0.5;
        }

        .clear-btn {
            background-color: #333;
            color: white;
            border: none;
            padding: 10px;
            font-size: 15px;
            font-weight: bold;
            border-radius: 8px;
            margin-top: auto;
            cursor: pointer;
            box-shadow: 0 4px 0 #111;
            transition: all 0.1s;
        }
        .clear-btn:active {
            transform: translateY(4px);
            box-shadow: 0 0px 0 #111;
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>🎲 CFOP Tracker</h1>
    </div>

    <!-- แผงปุ่มกด 4x3 -->
    <div class="keypad">
        <button class="cube-btn btn-u" onclick="pressBtn('U')">U</button>
        <button class="cube-btn btn-u prime" onclick="pressBtn('U\'')">U'</button>
        <button class="cube-btn btn-d" onclick="pressBtn('D')">D</button>
        <button class="cube-btn btn-d prime" onclick="pressBtn('D\'')">D'</button>

        <button class="cube-btn btn-l" onclick="pressBtn('L')">L</button>
        <button class="cube-btn btn-l prime" onclick="pressBtn('L\'')">L'</button>
        <button class="cube-btn btn-r" onclick="pressBtn('R')">R</button>
        <button class="cube-btn btn-r prime" onclick="pressBtn('R\'')">R'</button>

        <button class="cube-btn btn-f" onclick="pressBtn('F')">F</button>
        <button class="cube-btn btn-f prime" onclick="pressBtn('F\'')">F'</button>
        <button class="cube-btn btn-b" onclick="pressBtn('B')">B</button>
        <button class="cube-btn btn-b prime" onclick="pressBtn('B\'')">B'</button>
    </div>

    <!-- แผงแสดงผล -->
    <div class="display-board">
        <div class="step-row active-container" id="row-cross" onclick="setActiveRow('cross')">
            <div class="step-label">CROSS</div>
            <input type="text" id="cross" class="step-input active-step" readonly>
            <button class="next-btn" onclick="goToNext('cross', event)">✅</button>
        </div>

        <div class="step-row" id="row-f1" onclick="setActiveRow('f1')">
            <div class="step-label">F1</div>
            <input type="text" id="f1" class="step-input" readonly>
            <button class="next-btn" onclick="goToNext('f1', event)">✅</button>
        </div>

        <div class="step-row" id="row-f2" onclick="setActiveRow('f2')">
            <div class="step-label">F2</div>
            <input type="text" id="f2" class="step-input" readonly>
            <button class="next-btn" onclick="goToNext('f2', event)">✅</button>
        </div>

        <div class="step-row" id="row-f3" onclick="setActiveRow('f3')">
            <div class="step-label">F3</div>
            <input type="text" id="f3" class="step-input" readonly>
            <button class="next-btn" onclick="goToNext('f3', event)">✅</button>
        </div>

        <div class="step-row" id="row-f4" onclick="setActiveRow('f4')">
            <div class="step-label">F4</div>
            <input type="text" id="f4" class="step-input" readonly>
            <button class="next-btn" onclick="goToNext('f4', event)">✅</button>
        </div>

        <div class="step-row" id="row-oll" onclick="setActiveRow('oll')">
            <div class="step-label">OLL</div>
            <input type="text" id="oll" class="step-input" readonly>
            <button class="next-btn" onclick="goToNext('oll', event)">✅</button>
        </div>

        <div class="step-row" id="row-pll" onclick="setActiveRow('pll')">
            <div class="step-label">PLL</div>
            <input type="text" id="pll" class="step-input" readonly>
            <button class="next-btn" onclick="goToNext('pll', event)">✅</button>
        </div>

        <button class="clear-btn" onclick="clearSequence()">🗑️ ล้างข้อมูลทั้งหมด</button>
    </div>

    <script>
        const stepOrder = ['cross', 'f1', 'f2', 'f3', 'f4', 'oll', 'pll'];
        let currentActiveRow = 'cross';

        function setActiveRow(rowId) {
            document.querySelectorAll('.step-input').forEach(input => input.classList.remove('active-step'));
            document.querySelectorAll('.step-row').forEach(row => row.classList.remove('active-container'));
            
            currentActiveRow = rowId;
            document.getElementById(rowId).classList.add('active-step');
            document.getElementById('row-' + rowId).classList.add('active-container');
            
            if (navigator.vibrate) navigator.vibrate(20);
        }

        function goToNext(currentId, event) {
            event.stopPropagation();
            if (navigator.vibrate) navigator.vibrate(20);

            const currentIndex = stepOrder.indexOf(currentId);
            if (currentIndex < stepOrder.length - 1) {
                const nextId = stepOrder[currentIndex + 1];
                setActiveRow(nextId);
            } else {
                alert("🎉 บันทึกลำดับเสร็จสิ้นครบทุกขั้นตอน!");
            }
        }

        function pressBtn(move) {
            const displayBox = document.getElementById(currentActiveRow);
            if (navigator.vibrate) navigator.vibrate(30);

            if (displayBox.value === '') {
                displayBox.value = move;
            } else {
                displayBox.value += ' ' + move;
            }
            // หากเกิด 10 ตัวแล้วมีการล้นจริงๆ กล่องยังคงเลื่อนขวาให้อัตโนมัติอยู่
            displayBox.scrollLeft = displayBox.scrollWidth;
        }

        function clearSequence() {
            if (navigator.vibrate) navigator.vibrate([50, 50, 50]);

            stepOrder.forEach(row => {
                document.getElementById(row).value = '';
            });
            setActiveRow('cross');
        }
    </script>

</body>
</html>
